[project]
name = "rag-cli"
version = "0.1.0"
description = "A lightweight command-line tool for building and querying RAG workflows from local files and documents."
readme = "README.md"
authors = [
    { name = "Arian Latifi", email = "latifi.arian@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "chromadb>=1.5.9",
    "dotenv>=0.9.9",
    "openai>=3.24.0",
    "pymongo>=4.18.1",
    "pytest>=9.1.1",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "typer>=0.27.2",
]

[project.scripts]
rag-cli = "rag_cli.main:app"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
